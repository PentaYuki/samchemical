backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "main"
        label: "Main Content"
        file: "_data/site.yml"
        fields:

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Line 1", name: "title_line1", widget: "string" }
              - { label: "Line 2 (green)", name: "title_line2", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }

          - label: "Problems (4 items)"
            name: "problems"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          - label: "Approach Steps"
            name: "approach"
            widget: "object"
            fields:
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
              - { label: "Footer Note", name: "note", widget: "text" }

          - label: "Solutions (6 items)"
            name: "solutions"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          - label: "Regions (4 items)"
            name: "regions"
            widget: "list"
            fields:
              - { label: "Region Name", name: "name", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          - { label: "Footer Headline", name: "footer_headline", widget: "string" }
          - { label: "Footer Headline (accent/green)", name: "footer_headline_accent", widget: "string" }
          - { label: "Footer Subtext", name: "footer_subtext", widget: "text" }

          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "WhatsApp Link", name: "whatsapp", widget: "string" }
